services:
  - type: web
    name: careops-app
    env: node
    plan: free
    buildCommand: npx prisma generate && npm run build
    installCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: careops-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        value: https://careops-app.onrender.com # Change to your actual Render URL
      - key: JWT_SECRET
        generateValue: true
      - key: VAPI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: EMAIL_HOST
        value: smtp.resend.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        value: resend
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: careops-db
    plan: free
